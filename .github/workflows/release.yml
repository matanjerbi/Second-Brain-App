name: Build APK and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          errs=$(grep -E "^e: |error:|What went wrong" -A3 build.log | head -80 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${errs}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SecondBrain-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Second Brain v1.0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Install: download the APK below on your phone and open it.
          files: SecondBrain-v1.0.${{ github.run_number }}.apk
          make_latest: true
